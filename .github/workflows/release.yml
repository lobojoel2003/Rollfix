name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v1.0.0. If it doesn't exist yet, it's created on the latest commit of the branch you run this on."
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rollfix-api

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Package and publish
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find the commit to release
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            git checkout -q "refs/tags/$TAG"
            echo "TAG_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "Tag $TAG doesn't exist yet; it will be created on $(git rev-parse --short HEAD)."
            echo "TAG_EXISTS=false" >> "$GITHUB_ENV"
          fi
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: npm ci

      - name: Check the tag matches every version number
        run: |
          npm run version:check -- "$TAG"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Build the web app
        run: npm run build

      - name: Package release files
        run: bash scripts/package-release.sh "$VERSION"

      - name: Write release notes from CHANGELOG.md
        run: npm run --silent release:notes -- "$VERSION" "$BUILD_NUMBER" > dist/RELEASE_NOTES.md

      - name: Attest build provenance for the files
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.zip
            dist/*.whl
            dist/*.tar.gz
            dist/*.cdx.json

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
            type=raw,value=build-${{ env.BUILD_NUMBER }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=rollfix-api
            org.opencontainers.image.description=Rollfix stats API: opt-in anonymous wheelchair repair delay numbers
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: Build and push the API image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            BUILD_NUMBER=${{ env.BUILD_NUMBER }}
            COMMIT=${{ env.TARGET_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest build provenance for the image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          TITLE="Rollfix v$VERSION (build $BUILD_NUMBER)"
          FILES=(dist/*.zip dist/*.whl dist/*.tar.gz dist/*.cdx.json dist/SHA256SUMS.txt)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file dist/RELEASE_NOTES.md
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            VERIFY=""
            if [ "$TAG_EXISTS" = "true" ]; then VERIFY="--verify-tag"; fi
            gh release create "$TAG" "${FILES[@]}" --title "$TITLE" --notes-file dist/RELEASE_NOTES.md \
              --target "$TARGET_SHA" $VERIFY $PRERELEASE
          fi
          {
            echo "### Published $TITLE"
            echo ""
            echo "Image: \`$IMAGE:$VERSION\` (${{ steps.image.outputs.digest }})"
            echo ""
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
